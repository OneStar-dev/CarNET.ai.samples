# The Xcode project is made from this file with XcodeGen (https://github.com/yonaskolb/XcodeGen): `xcodegen`.
# You don't need XcodeGen to build the app: CarRecognition.xcodeproj is in the repo.
name: CarRecognition
options:
  bundleIdPrefix: ai.carnet.samples
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "" # choose your team in Xcode: Signing & Capabilities
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CarRecognition:
    type: application
    platform: iOS
    sources: [CarRecognition]
    info:
      path: CarRecognition/Info.plist
      properties:
        CFBundleDisplayName: Which car?
        NSCameraUsageDescription: Take a photo of a car to recognize it.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # CarNET Server speaks plain HTTP on your own network; this lets the app reach it there.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.carnet.samples.CarRecognition
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  CarRecognitionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CarRecognitionTests]
    dependencies:
      - target: CarRecognition
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.carnet.samples.CarRecognitionTests
schemes:
  CarRecognition:
    build:
      targets:
        CarRecognition: all
    test:
      targets: [CarRecognitionTests]

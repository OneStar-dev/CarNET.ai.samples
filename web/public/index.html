<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Which car is this?</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Which car is this?</h1>
    <p class="lead">Drop a car photo, choose one, paste one, or try an example. Recognition by the
      <a href="https://carnet.ai" target="_blank" rel="noopener">CarNET API</a>.</p>

    <div id="drop" class="drop">
      <p><strong>Drop a photo here</strong> or
        <label class="pick">choose a file<input id="file" type="file" accept="image/*"></label></p>
      <p class="hint">JPEG, PNG, WEBP, GIF, BMP or TIFF, up to 12&nbsp;MB. You can also paste a photo.</p>
    </div>

    <p class="examples-title">Examples</p>
    <div class="examples">
      <button type="button" data-photo="examples/car-1.jpg"><img src="examples/thumb/car-1.jpg" alt="Example photo 1"></button>
      <button type="button" data-photo="examples/car-2.jpg"><img src="examples/thumb/car-2.jpg" alt="Example photo 2"></button>
      <button type="button" data-photo="examples/car-3.jpg"><img src="examples/thumb/car-3.jpg" alt="Example photo 3"></button>
      <button type="button" data-photo="examples/car-4.jpg"><img src="examples/thumb/car-4.jpg" alt="Example photo 4"></button>
      <button type="button" data-photo="examples/car-5.jpg"><img src="examples/thumb/car-5.jpg" alt="Example photo 5"></button>
      <button type="button" data-photo="examples/car-6.jpg"><img src="examples/thumb/car-6.jpg" alt="Example photo 6"></button>
    </div>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="result" hidden>
      <div class="photo">
        <img id="photo" alt="The photo sent">
        <div id="boxes"></div>
      </div>
      <ol id="cars"></ol>
      <details>
        <summary>The API's answer</summary>
        <pre id="answer"></pre>
      </details>
    </section>
  </main>
</body>
</html>
